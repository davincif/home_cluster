version: "3.8"

services:
  db:
    image: mariadb:10.11
    container_name: seafile-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${SEAFILE_DB_ROOT_PASSWD}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - /media/usb1/seafile-mysql:/var/lib/mysql
    networks:
      - seafile-net
    restart: unless-stopped

  memcached:
    image: memcached:1.6
    container_name: seafile-memcached
    entrypoint: memcached -m 256
    networks:
      - seafile-net
    restart: unless-stopped

  seafile:
    image: seafileltd/seafile-ce:latest
    container_name: seafile
    ports:
      - "8063:80"
    volumes:
      - /media/usb1/seafile-data:/shared
    environment:
      - DB_HOST=db
      - DB_ROOT_PASSWD=${SEAFILE_DB_ROOT_PASSWD}
      - TIME_ZONE=Europe/Lisbon
      - SEAFILE_ADMIN_EMAIL=LDaVinciF.pt@gmail.com
      - SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD}
      - SEAFILE_SERVER_LETSENCRYPT=false
      - SEAFILE_SERVER_HOSTNAME=seafile.ldavincif.com
    networks:
      - seafile-net
    depends_on:
      - db
      - memcached
    restart: unless-stopped

networks:
  seafile-net:
    driver: bridge
