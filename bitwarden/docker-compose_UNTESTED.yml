services:
  bitwarden:
    image: bitwarden/self-hosted:latest
    container_name: bitwarden
    restart: always
    depends_on:
      - db
    environment:
      - BW_DB_PROVIDER=postgresql
      - BW_DB_CONNECTION_STRING=postgresql://bitwarden:YourSecurePassword@db:5432/bitwardendb
      - BW_INSTALLATION_ID=your-installation-id-here
      - BW_INSTALLATION_KEY=your-installation-key-here
    volumes:
      - ./bwdata:/etc/bitwarden
    ports:
      - 8080:8080

  db:
    image: postgres:15-alpine
    container_name: bitwarden-db
    restart: always
    environment:
      - POSTGRES_USER=bitwarden
      - POSTGRES_PASSWORD=YourSecurePassword
      - POSTGRES_DB=bitwardendb
    volumes:
      - ./db-data:/var/lib/postgresql/data
