apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: hlab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.24
          ports:
            - containerPort: 3000
            - containerPort: 22
          volumeMounts:
            - name: gitea-volume
              mountPath: /data
          envFrom:
            - configMapRef:
                name: gitea-config
            - secretRef:
                name: gitea-secret
      volumes:
        - name: gitea-volume
          persistentVolumeClaim:
            claimName: gitea-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-postgres
  namespace: hlab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitea-postgres
  template:
    metadata:
      labels:
        app: gitea-postgres
    spec:
      containers:
        - name: gitea-postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: gitea-postgres-volume
              mountPath: /var/lib/postgresql/data
          envFrom:
            - secretRef:
                name: gitea-postgres-secret
      volumes:
        - name: gitea-postgres-volume
          persistentVolumeClaim:
            claimName: gitea-postgres-pvc
