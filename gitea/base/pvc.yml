apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-pvc
  # namespace: hprod
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: gitea-hprod-expandable
  resources:
    requests:
      storage: 2Gi

