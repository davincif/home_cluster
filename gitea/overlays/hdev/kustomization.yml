apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namespace: gitea-dev

# Patches para o ambiente de desenvolvimento
patches:
  # Mudar o host do Ingress
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: gitea.dev.example.com
    target:
      kind: Ingress
      name: gitea-ingress

  # Mudar o domínio e URL do Gitea
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/7/value
        value: gitea.dev.example.com
      - op: replace
        path: /spec/template/spec/containers/0/env/8/value
        value: https://gitea.dev.example.com/
    target:
      kind: StatefulSet
      name: gitea

  # Reduzir o tamanho dos PVCs para dev
  - patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
    target:
      kind: PersistentVolumeClaim
      name: gitea-postgres-pvc
  - patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
    target:
      kind: PersistentVolumeClaim
      name: gitea-data-pvc
