apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: hprod
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: gitea
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-postgres
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: gitea-postgres
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
