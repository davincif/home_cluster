# Gitlab Docs on docker
# https://docs.gitea.com/installation/install-with-docker

networks:
  gitea:
    external: false

services:
  server:
    image: docker.gitea.com/gitea:28.2.0
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1003
      - GITEA__server__ROOT_URL=https://gitea.ldavincif.com/
      - GITEA__server__SSH_DOMAIN=gitea-ssh.ldavincif.com
      - GITEA__actions__ENABLED=true

      # SMTP Configuration (AWS SES Mail Manager) - values come from .env
      - GITEA__mailer__ENABLED=true
      - GITEA__mailer__PROTOCOL=smtp+starttls
      - GITEA__mailer__SMTP_ADDR=${SMTP_HOST:?SMTP_HOST is not set}
      - GITEA__mailer__SMTP_PORT=${SMTP_PORT:-587}
      - GITEA__mailer__USER=${SMTP_USERNAME:?SMTP_USERNAME is not set}
      - GITEA__mailer__PASSWD=${SMTP_PASSWORD:?SMTP_PASSWORD is not set}
      - GITEA__mailer__FROM=${SMTP_FROM:?SMTP_FROM is not set}
    restart: unless-stopped
    networks:
      - gitea
    volumes:
      - /opt/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
