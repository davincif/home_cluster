networks:
  gitea:
    external: false

services:
  server:
    image: docker.gitea.com/gitea:1.27.0
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1003
      - GITEA__server__ROOT_URL=https://gitea.ldavincif.com/
    restart: always
    networks:
      - gitea
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
